baseURL: https://zhang-shanfeng.github.io
defaultContentLanguage: zh
locale: "zh-Hans"
paginate: 10
title: Zhang Shanfeng's Blog
theme: dream #PaperMod


enableRobotsTXT: true
hasCJKLanguage: true

params:
  # zenMode: true
  lightTheme: "emerald"
  darkTheme: "forest"

  backgroundImage: "img/global-background.jpg"
  backgroundImageDark: "img/global-background-dark.jpg"

  # images: "img/global-background.jpg"
  author: "Zhang ShanFeng"
  description: "这是一个个人博客网站，核心关注领域：电子技术与编程开发，另外该网站也是我学习工作中用作记录笔记的地方，欢迎大家访问我的网站。"
  avatar: "img/personal/avatar.jpg"
  headerTitle: "Zhang Shanfeng's Blog"
  motto: "与其感慨路难行，不如马上出发。"

# footerBottomText = ""

  rss: true

  #utterancesRepo: "g1eny0ung/g1eny0ung.github.io"

# valine = true
# LEANCLOUD_APP_ID = ""
# LEANCLOUD_APP_KEY = ""

# waline = true
# walineServer = ""

  email: "freerealmshn@gmail.com"

  siteStartYear: 2026

  favicon: "favicon.ico"

# Syntax highlighting
  customSyntaxHighlighting: true

  # options
  stickyNav: true
  navItems:
    github:
      href: https://github.com/zhang-shanfeng
      target: "_blank"
      icon: "logo-github"
      title: Github
  reorderNavItems: ["about", "github", "search", "rss", "posts", "categories", "tags"]
  collapseNavItems: ["posts", "categories", "tags"]
  noDefaultSummaryCover: true
  showTableOfContents: true
  showSummaryCoverInPost: true
  imageZoomableInPost: true
  showPrevNextPost: true
  # reorderShares = ["x", "facebook", "whatsapp"]

  advanced:
    customCSS: ["css/custom.css"]
    customJS: ["js/custom.js"]

  # experimental:
  #   jsDate: true
  #   jsDateFormat: "2026年02月01日"

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: false
    style: github

services:
  googleAnalytics:
    id: G-X2W6T1HYZZ
