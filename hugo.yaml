baseURL: https://zhang-shanfeng.github.io
locale: zh-CN
paginate: 10
title: Zhang Shanfeng's Blog
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# 必须配置，否则不会生成搜索索引
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  title: Zhang Shanfeng's Blog
  description: "这是一个个人博客网站，核心关注领域：电子技术与编程开发，另外该网站也是我学习工作中用作记录笔记的地方，欢迎大家访问我的网站。"
  keywords: [Blog, ESP32, PCB, Tauri, Vue, FreeRTOS, Linux, 电子仪器, 数据采集电路, 数据生成, 数据分析, 工具软件, sfeekit]
  author: zhang-shanfeng
  images: ["/icons/128x128.png"]
  DateFormat: "January 2, 2006"
  defaultTheme: light # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false




  assets:
    favicon: "/icons/icon.ico"
    favicon32x32: "/icons/32x32.png"

  label:
    text: "Zhang Shanfeng's Blog"
    icon: /icons/64x64.png
    iconHeight: 35

  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my blog

  socialIcons:
    - name: "github"
      url: "https://github.com/zhang-shanfeng"
    - name: "bilibili"
      url: "https://space.bilibili.com/334715750"

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

  cover:
      hidden: false # hide everywhere but not in structured data
      hiddenInList: true # hide on list pages and home
      hiddenInSingle: false # hide on single page

menu:
  main:
    - identifier: about
      name: About
      pageRef: /about/
      weight: 30
    - identifier: tags
      name: Tags
      url: "/tags/"
      weight: 20
    - identifier: categories
      name: Categories
      url: "/categories/"
      weight: 10
    - identifier: archives
      name: Archive
      url: "/archives/"
      weight: 10
    - identifier: search
      name: Search
      url: "/search/"
      weight: 10

markup:
  goldmark:
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '\['
              - '\]'
            - - '$$'
              - '$$'
          inline:
            - - '\('
              - '\)'
            - - '$'
              - '$'
